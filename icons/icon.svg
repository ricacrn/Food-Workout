<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E3A2F"/>
      <stop offset="1" stop-color="#0C1A14"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2F6B3A"/>
      <stop offset="1" stop-color="#173D23"/>
    </linearGradient>
    <radialGradient id="flesh" cx="0.45" cy="0.42" r="0.7">
      <stop offset="0" stop-color="#F3F5C8"/>
      <stop offset="0.45" stop-color="#C9E27A"/>
      <stop offset="1" stop-color="#8FBF4A"/>
    </radialGradient>
    <radialGradient id="pit" cx="0.38" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#8A5A3A"/>
      <stop offset="0.6" stop-color="#5A3620"/>
      <stop offset="1" stop-color="#3A2114"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F4F2"/>
      <stop offset="0.5" stop-color="#C9CBC9"/>
      <stop offset="1" stop-color="#8E918F"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A3D3C"/>
      <stop offset="1" stop-color="#121413"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="round"><rect width="512" height="512" rx="114"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <!-- soft light in the corner -->
    <radialGradient id="glow" cx="0.2" cy="0.15" r="0.7"><stop offset="0" stop-color="#7FBF5A" stop-opacity="0.22"/><stop offset="1" stop-color="#7FBF5A" stop-opacity="0"/></radialGradient><rect width="512" height="512" fill="url(#glow)"/>

    <!-- dumbbell: bar behind, plates on the sides -->
    <g filter="url(#sh)">
      <rect x="40" y="238" width="432" height="36" rx="18" fill="url(#steel)"/>
      <!-- left plates -->
      <rect x="62" y="186" width="34" height="140" rx="12" fill="url(#plate)"/>
      <rect x="100" y="166" width="42" height="180" rx="14" fill="url(#plate)"/>
      <!-- right plates -->
      <rect x="416" y="186" width="34" height="140" rx="12" fill="url(#plate)"/>
      <rect x="370" y="166" width="42" height="180" rx="14" fill="url(#plate)"/>
      <!-- highlights on plates -->
      <rect x="106" y="172" width="6" height="168" rx="3" fill="#fff" opacity="0.10"/>
      <rect x="376" y="172" width="6" height="168" rx="3" fill="#fff" opacity="0.10"/>
    </g>

    <!-- avocado half, slightly tilted, sitting on the bar -->
    <g transform="translate(256 262) rotate(-14)" filter="url(#sh)">
      <!-- skin -->
      <path d="M0 -170 C 64 -170 98 -122 98 -62 C 98 -6 138 34 138 96 C 138 162 74 180 0 180 C -74 180 -138 162 -138 96 C -138 34 -98 -6 -98 -62 C -98 -122 -64 -170 0 -170 Z" fill="url(#skin)"/>
      <!-- flesh -->
      <path d="M0 -152 C 54 -152 82 -110 82 -58 C 82 -8 120 30 120 92 C 120 148 64 162 0 162 C -64 162 -120 148 -120 92 C -120 30 -82 -8 -82 -58 C -82 -110 -54 -152 0 -152 Z" fill="url(#flesh)"/>
      <!-- pit -->
      <circle cx="0" cy="82" r="58" fill="url(#pit)"/>
      <ellipse cx="-20" cy="60" rx="18" ry="12" fill="#fff" opacity="0.22"/>
      <!-- flesh highlight -->
      <path d="M-46 -108 C -20 -132 20 -132 46 -110" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity="0.35"/>
    </g>
  </g>
</svg>
